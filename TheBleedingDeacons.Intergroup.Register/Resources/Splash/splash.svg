<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" version="1.1" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
 <title>AA recovery app splash mark</title>
 <desc>A flat triangular mark in two blues, with AA at the center and unity, recovery, service along the three sides.</desc>
 <g stroke-linejoin="round">
  <polygon points="340 140 550 505 130 505" fill="none" opacity=".35" stroke="#4A90C2" stroke-width="8"/>
  <polygon points="340 195 505 480 175 480" fill="none" opacity=".55" stroke="#4A90C2" stroke-width="8"/>
  <polygon points="340 260 455 460 225 460" fill="#1E3A5F"/>
 </g>
 <text x="340" y="445" fill="#FFFFFF" font-family="sans-serif" font-size="110" font-weight="500" letter-spacing="2" text-anchor="middle">AA</text>
 <g fill="#1E3A5F" font-family="sans-serif" font-size="22" font-weight="500" letter-spacing="3" text-anchor="middle">
  <text x="340" y="540">UNITY</text>
  <text transform="rotate(-60 205 300)" x="205" y="300">RECOVERY</text>
  <text transform="rotate(60 475 300)" x="475" y="300">SERVICE</text>
 </g>
 <metadata>
  <rdf:RDF>
   <cc:Work rdf:about="">
    <dc:title>AA recovery app splash mark</dc:title>
   </cc:Work>
  </rdf:RDF>
 </metadata>
</svg>
