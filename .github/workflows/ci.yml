name: CI

# Five jobs:
#  * build          — compile the Android head of the MAUI app and run the StyleCop /
#                     Meziantou analyzers (rules escalated to "error" in .editorconfig
#                     fail the build, so this is a real quality gate).
#  * build-windows  — the same gate for the Windows head, which is a shipping
#                     platform too. It needs its own runner: the Windows head only
#                     exists when building on Windows (see the IsOSPlatform
#                     condition on TargetFrameworks), and it is the only head that
#                     reports the WinRT/CsWinRT analyzers — MVVMTK0045 and friends
#                     are invisible to the Ubuntu job. Without this the Windows
#                     head can rot unnoticed, which is exactly what happened to the
#                     iOS and MacCatalyst heads.
#  * test           — the Unity.Intergroup suite. net9.0, so it runs on Ubuntu.
#  * test-register  — the Register app suite. Must run on Windows: the app is a MAUI
#                     single-project app whose only target frameworks are platform
#                     heads, and the Windows head is the one that hosts an ordinary
#                     console test runner.
#  * coverage       — closes the parallel Coveralls build once both suites have
#                     uploaded. Without it Coveralls leaves the build open and
#                     reports only whichever half arrived last.
#
# Both test jobs run xUnit v3 on Microsoft.Testing.Platform with Coverlet coverage.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # restore Integrity.Client from GitHub Packages

# The Register app transitively depends on the Integrity C# client, consumed as
# the Integrity.Client package from GitHub Packages (see nuget.config). That
# registry requires authentication even for packages from public repos.
#
# The package is linked to the integrity-sharp repository, and a GITHUB_TOKEN
# cannot read a package belonging to a different repository — that combination
# returns 403 — so restore uses PACKAGES_READ_TOKEN, a secret holding a classic
# PAT with the read:packages scope. GITHUB_TOKEN remains as a fallback in case
# the package is later granted access to this repository under its Manage
# Actions access settings.
env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build & analyze (net9.0-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout register
        uses: actions/checkout@v5

      # A revoked or expired token is still non-empty, so probe the feed rather
      # than only checking the variable is set. Otherwise the failure surfaces
      # several minutes later as a wall of NU1301/403 restore errors.
      - name: Verify GitHub Packages credentials
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "bleedingdeacons:$GITHUB_PACKAGES_TOKEN" \
            https://nuget.pkg.github.com/bleedingdeacons/download/integrity.client/index.json)
          case "$code" in
            200) echo "GitHub Packages authentication OK" ;;
            401|403) echo "::error::GitHub Packages rejected the credentials (HTTP $code). PACKAGES_READ_TOKEN is missing, expired, or lacks the read:packages scope — rotate it in this repository's secrets."; exit 1 ;;
            *) echo "::warning::Unexpected HTTP $code probing GitHub Packages; continuing and letting restore report the outcome." ;;
          esac

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # appsettings.json is git-ignored (it can hold environment-specific
      # config) but is embedded unconditionally by the app. CI only needs the
      # file to exist for the compile/analyze gate — its contents are
      # irrelevant here — so write a placeholder when it's absent.
      - name: Ensure git-ignored appsettings.json exists
        run: |
          f=TheBleedingDeacons.Intergroup.Register/appsettings.json
          if [ ! -f "$f" ]; then printf '{}\n' > "$f"; echo "wrote placeholder $f"; else echo "$f already present"; fi

      # Single build with implicit restore. RegisterAndroidOnly=true trims the
      # app to just the net9.0-android head, so we restore/build only the
      # Android graph — no iOS/MacCatalyst workloads needed. Still do NOT pass
      # -f net9.0-android: that sets TargetFramework as a global property, which
      # forces net9.0-android onto the net9.0-only projects in this repo and
      # breaks their restore (NU1105). RegisterAndroidOnly instead narrows only
      # the Register project's TargetFrameworks, letting each project reference
      # resolve its own TFM.
      #
      # Debug config: no code signing (keystore is not in the repo) and no
      # dev credentials baked in. Analyzer errors from .editorconfig break
      # the build here.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Register/TheBleedingDeacons.Intergroup.Register.csproj
          -c Debug
          -p:RegisterAndroidOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

  build-windows:
    name: Build & analyze (net9.0-windows)
    runs-on: windows-latest

    steps:
      - name: Checkout register
        uses: actions/checkout@v5

      # Same preflight as the build job; see the comment there. Forced to bash
      # because windows-latest defaults to PowerShell and this is shell script.
      - name: Verify GitHub Packages credentials
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "bleedingdeacons:$GITHUB_PACKAGES_TOKEN" \
            https://nuget.pkg.github.com/bleedingdeacons/download/integrity.client/index.json)
          case "$code" in
            200) echo "GitHub Packages authentication OK" ;;
            401|403) echo "::error::GitHub Packages rejected the credentials (HTTP $code). PACKAGES_READ_TOKEN is missing, expired, or lacks the read:packages scope — rotate it in this repository's secrets."; exit 1 ;;
            *) echo "::warning::Unexpected HTTP $code probing GitHub Packages; continuing and letting restore report the outcome." ;;
          esac

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # No JDK and no Android SDK here — the Windows head needs neither.
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # See the Android job for why this placeholder is needed.
      - name: Ensure git-ignored appsettings.json exists
        shell: bash
        run: |
          f=TheBleedingDeacons.Intergroup.Register/appsettings.json
          if [ ! -f "$f" ]; then printf '{}\n' > "$f"; echo "wrote placeholder $f"; else echo "$f already present"; fi

      # RegisterWindowsOnly mirrors RegisterAndroidOnly: it narrows this
      # project's TargetFrameworks to the single head under test, so the runner
      # needs no Android/iOS/MacCatalyst workloads. As in the Android job, do NOT
      # substitute the -f option — that sets TargetFramework globally and breaks
      # restore of the net9.0-only projects with NU1105.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Register/TheBleedingDeacons.Intergroup.Register.csproj
          -c Debug
          -p:RegisterWindowsOnly=true
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true

  test:
    name: Test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout register
        uses: actions/checkout@v5

      # Same preflight as the build job; see the comment there.
      - name: Verify GitHub Packages credentials
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "bleedingdeacons:$GITHUB_PACKAGES_TOKEN" \
            https://nuget.pkg.github.com/bleedingdeacons/download/integrity.client/index.json)
          case "$code" in
            200) echo "GitHub Packages authentication OK" ;;
            401|403) echo "::error::GitHub Packages rejected the credentials (HTTP $code). PACKAGES_READ_TOKEN is missing, expired, or lacks the read:packages scope — rotate it in this repository's secrets."; exit 1 ;;
            *) echo "::warning::Unexpected HTTP $code probing GitHub Packages; continuing and letting restore report the outcome." ;;
          esac

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # Unity.Intergroup and its tests are net9.0 — no MAUI workload needed.
      - name: Build tests
        run: >
          dotnet build TheBleedingDeacons.Unity.Intergroup.Tests/TheBleedingDeacons.Unity.Intergroup.Tests.csproj
          -c Debug

      # xUnit v3 runs on Microsoft.Testing.Platform, so the test project is an
      # executable. coverlet.console instruments the register-owned assembly and
      # runs the test host, producing a Cobertura report. (coverlet's collector /
      # msbuild integrations hook VSTest, which MTP doesn't use — hence the tool.)
      - name: Test with coverage
        run: >
          dotnet coverlet TheBleedingDeacons.Unity.Intergroup.Tests/bin/Debug/net9.0/TheBleedingDeacons.Unity.Intergroup.Tests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Unity.Intergroup.Tests/bin/Debug/net9.0/TheBleedingDeacons.Unity.Intergroup.Tests.dll"
          --format cobertura
          --output coverage/coverage.cobertura.xml
          --include "[TheBleedingDeacons.Unity.Intergroup]*"

      # Two jobs upload coverage for different assemblies, so both must be
      # flagged and marked parallel — otherwise the second upload replaces the
      # first instead of adding to it. The `coverage` job closes the build.
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          # Public repo: the built-in GITHUB_TOKEN authenticates the upload,
          # so no separate Coveralls token/secret is required.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura
          flag-name: unity-intergroup
          parallel: true
          fail-on-error: false

  test-register:
    name: Test & coverage (Register)
    runs-on: windows-latest

    steps:
      - name: Checkout register
        uses: actions/checkout@v5

      # Same preflight as the build job; see the comment there. Forced to bash
      # because windows-latest defaults to PowerShell and this is shell script.
      - name: Verify GitHub Packages credentials
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "bleedingdeacons:$GITHUB_PACKAGES_TOKEN" \
            https://nuget.pkg.github.com/bleedingdeacons/download/integrity.client/index.json)
          case "$code" in
            200) echo "GitHub Packages authentication OK" ;;
            401|403) echo "::error::GitHub Packages rejected the credentials (HTTP $code). PACKAGES_READ_TOKEN is missing, expired, or lacks the read:packages scope — rotate it in this repository's secrets."; exit 1 ;;
            *) echo "::warning::Unexpected HTTP $code probing GitHub Packages; continuing and letting restore report the outcome." ;;
          esac

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Only the Windows head is built here, so no JDK / Android SDK / Apple
      # workloads are needed. See the RegisterWindowsOnly note on the build step.
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      # See the Android job for why this placeholder is needed. The test project
      # deliberately asserts nothing that depends on its contents.
      - name: Ensure git-ignored appsettings.json exists
        shell: bash
        run: |
          f=TheBleedingDeacons.Intergroup.Register/appsettings.json
          if [ ! -f "$f" ]; then printf '{}\n' > "$f"; echo "wrote placeholder $f"; else echo "$f already present"; fi

      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # RegisterWindowsOnly MUST be passed here rather than left to the test
      # project's ProjectReference metadata. The csproj sets it via
      # AdditionalProperties, which applies to the build but NOT to restore —
      # restore would still walk all four of the app's target frameworks and
      # demand the Android and Apple workloads on this runner. A global property
      # narrows both. (UseDevCredentials=false is also set on that
      # ProjectReference; it only affects compilation, so the csproj is enough.)
      #
      # Implicit restore inherits the global property, so one command does both.
      - name: Build tests
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Register.UnitTests/TheBleedingDeacons.Intergroup.Register.UnitTests.csproj
          -c Debug
          -p:RegisterWindowsOnly=true

      # Same coverlet.console wrapper as the Ubuntu test job — see the comment
      # there for why the collector/msbuild integrations are not used. The
      # include filter scopes the report to the app assembly, excluding xUnit,
      # MAUI and the Unity library (which the other job already reports).
      #
      # exclude-by-file drops the XAML plumbing the MAUI build generates into
      # obj/ — XamlTypeInfo.g.cs alone is ~1,600 lines that no test can ever
      # execute and that nobody can act on. Left in, it was 15% of the reported
      # uncovered total and made the percentage describe the code generator
      # rather than the code we write.
      - name: Test with coverage
        shell: bash
        run: >
          dotnet coverlet TheBleedingDeacons.Intergroup.Register.UnitTests/bin/Debug/net9.0-windows10.0.19041.0/TheBleedingDeacons.Intergroup.Register.UnitTests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Intergroup.Register.UnitTests/bin/Debug/net9.0-windows10.0.19041.0/TheBleedingDeacons.Intergroup.Register.UnitTests.dll"
          --format cobertura
          --output coverage/coverage.register.cobertura.xml
          --include "[TheBleedingDeacons.Intergroup.Register]*"
          --exclude-by-file "**/obj/**"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.register.cobertura.xml
          format: cobertura
          flag-name: register
          parallel: true
          fail-on-error: false

  # Tells Coveralls both parallel uploads have arrived so it can finalise the
  # build. `always()` so a failure in one suite still closes the build rather
  # than leaving it pending forever — the failed job is the signal, not a
  # stuck Coveralls status.
  coverage:
    name: Finalise coverage
    runs-on: ubuntu-latest
    needs: [ test, test-register ]
    if: always()

    steps:
      - name: Close the parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: unity-intergroup,register
          fail-on-error: false
