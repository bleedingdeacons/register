name: CI

# Build the Android head of the MAUI app and run the StyleCop / Meziantou
# analyzers. Analyzer rules escalated to "error" in .editorconfig fail the
# build, so this workflow is a real quality gate.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & analyze (net9.0-android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout register
        uses: actions/checkout@v4

      # The Register app transitively references the Integrity C# client/model
      # projects, which live in their own public repo (integrity-sharp). Check
      # it out next to the register sources; IntegritySharpDir (below) points
      # the project references at it.
      - name: Checkout integrity-sharp (cross-repo project references)
        uses: actions/checkout@v4
        with:
          repository: bleedingdeacons/integrity-sharp
          path: integrity-sharp

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Single build with implicit restore. RegisterAndroidOnly=true trims the
      # app to just the net9.0-android head, so we restore/build only the
      # Android graph — no iOS/MacCatalyst workloads needed. Crucially we do
      # NOT pass -f net9.0-android: that sets TargetFramework as a global
      # property, which forces net9.0-android onto the referenced net9.0-only
      # integrity-sharp projects and breaks their restore (NU1105).
      # RegisterAndroidOnly instead narrows only the Register project's
      # TargetFrameworks, letting each project reference resolve its own TFM.
      #
      # Debug config: no code signing (keystore is not in the repo) and no
      # dev credentials baked in. Analyzer errors from .editorconfig break
      # the build here.
      - name: Build & analyze
        run: >
          dotnet build TheBleedingDeacons.Intergroup.Register/TheBleedingDeacons.Intergroup.Register.csproj
          -c Debug
          -p:RegisterAndroidOnly=true
          -p:IntegritySharpDir=../integrity-sharp
          -p:UseDevCredentials=false
          -p:ContinuousIntegrationBuild=true
